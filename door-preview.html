<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OPR · front door — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<!--
  door-preview.html — THREE FRONT DOORS, ON YOUR REAL DATA. Nothing here touches nat-padel.html.
  Open it, compare, pick one; then it gets folded into the build properly.

    ?club=north-coast   or  ?club=26   or  ?club=kloof-padel-club
    &v=1 / 2 / 3        to open on one version

  Every figure is read live from the register: the movers, the form, the tournament, the matches. Where a club
  has too little played to be interesting, the brackets say so plainly and show an example instead — a new club
  should not open to a broken-looking page on the day it matters most.
-->
<style>
  :root{ --ink:#1b1626; --mute:#6f6780; --line:#e6e0ee; --paper:#f7f5fa; --card:#fff;
         --club:#6c3483; --club-deep:#4a235a; --ledger:#2f2f2f; --ok:#1f8a4c; --down:#c0392b; --ball:#d8ea33; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .bar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar b{font-size:13px;margin-right:2px}
  .bar button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
  .bar button.on{background:var(--club);border-color:var(--club);color:#fff}
  .bar .who{margin-left:auto;font-size:12px;color:var(--mute)}
  .wrap{max-width:460px;margin:0 auto;padding:0 0 46px}

  /* the coloured band — the only strong colour on the page */
  .band{background:linear-gradient(135deg,var(--club),var(--club-deep));color:#fff;padding:16px 16px 20px;position:relative;overflow:hidden}
  .band::after{content:"";position:absolute;right:-40px;top:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07)}
  .mark{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.92}
  .mark i{width:8px;height:8px;border-radius:50%;background:var(--ball);display:block;box-shadow:0 0 8px rgba(216,234,51,.7)}
  .band h1{font-family:Fraunces,Georgia,serif;font-size:27px;line-height:1.08;margin:10px 0 3px;letter-spacing:-.2px}
  .band .sub{font-size:12.5px;opacity:.85}
  .band .pulse{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
  .band .pulse span{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700}

  .brk{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 12px 0;overflow:hidden}
  .brk > h2{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);font-weight:800;margin:0;padding:12px 14px 0;display:flex;align-items:center;gap:8px}
  .brk > h2 .tag{margin-left:auto;font-size:10.5px;letter-spacing:.04em;text-transform:none;color:#8a6d3b;background:#fdf6e3;border:1px solid #f0e2c0;border-radius:99px;padding:2px 8px;font-weight:700}
  .rows{padding:6px 6px 4px}
  .row{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:12px}
  .row + .row{border-top:1px solid var(--line)}
  .av{width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:grid;place-items:center;color:#fff;font-size:12.5px;font-weight:800;background:var(--club)}
  .nm{flex:1;min-width:0}
  .nm b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nm span{display:block;font-size:11.5px;color:var(--mute);margin-top:1px}
  .val{text-align:right;flex:0 0 auto}
  .val b{display:block;font-size:15px;font-weight:800}
  .val span{display:block;font-size:12px;font-weight:800}
  .up{color:var(--ok)} .dn{color:var(--down)}
  .more{display:block;text-align:center;padding:10px;border-top:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--club);text-decoration:none;background:#fcfbfd}
  .empty{padding:10px 14px 14px;font-size:12.5px;color:var(--mute);line-height:1.5}

  /* v2 — tiles */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 12px 0}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px}
  .tile .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:800}
  .tile .v{font-size:23px;font-weight:800;margin-top:5px;letter-spacing:-.4px}
  .tile .n{font-size:11.5px;color:var(--mute);margin-top:2px;line-height:1.35}
  .doit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:12px 12px 0}
  .doit button{border:none;border-radius:14px;padding:13px 6px;background:#fff;border:1px solid var(--line);font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:7px}
  .doit button.primary{background:linear-gradient(135deg,var(--club),var(--club-deep));color:#fff;border-color:transparent}
  .doit svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  .elsewhere{display:block;margin:14px 12px 0;padding:12px 14px;border:1px dashed #cfc6da;border-radius:14px;background:#fff;text-decoration:none;color:inherit}
  .elsewhere b{display:block;font-size:13.5px;color:var(--club)}
  .elsewhere span{display:block;font-size:12px;color:var(--mute);margin-top:3px}
  .foot{text-align:center;color:#a99cbb;font-size:10.5px;margin:16px 0 4px}
  .load{padding:40px 16px;text-align:center;color:var(--mute);font-size:13px}
  .spark{display:block;width:100%;height:42px}
</style>
</head>
<body>
<div class="bar">
  <b>Front door</b>
  <button id="b1" class="on" onclick="pick(1)">1 · Glimpses</button>
  <button id="b2" onclick="pick(2)">2 · Scoreboard</button>
  <button id="b3" onclick="pick(3)">3 · Quiet</button>
  <span class="who" id="who">loading…</span>
</div>
<div class="wrap" id="wrap"><div class="load">Reading the club…</div></div>

<script>
(function(){
  var SB="https://djmbnvikrdgnomjhtkgf.supabase.co";
  var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqbWJudmlrcmRnbm9tamh0a2dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTE0MzEsImV4cCI6MjEwMDk2NzQzMX0.vR8xlVFjV6jXW-pAclGjM74HqmWSKVpsacFjM-dCIJI";
  var q=new URLSearchParams(location.search);
  var want=(q.get("club")||"north-coast").trim();
  var V=parseInt(q.get("v")||"1",10)||1;
  var D={club:null,boards:[],pool:null,matches:[],movers:[],pairs:[],tour:null,example:false};

  function get(p){ return fetch(SB+"/rest/v1/"+p,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}}).then(function(r){ return r.json(); }); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function initials(n){ return String(n||"").split(/[\s&]+/).filter(Boolean).slice(0,2).map(function(w){ return w[0]; }).join("").toUpperCase(); }
  function dark(hex,f){ try{ var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.round(r*(1-f)); g=Math.round(g*(1-f)); b=Math.round(b*(1-f));
    return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }catch(e){ return "#4a235a"; } }
  function days(d){ return (Date.now()-new Date(d).getTime())/86400000; }

  /* ---------- the club, its boards, and what has happened lately ---------- */
  function load(){
    var byId=/^\d+$/.test(want);
    var first = byId ? get("plat_clubs?id=eq."+want+"&select=id,name,colour,pool_id")
                     : get("nat_club_slugs?slug=eq."+encodeURIComponent(want.toLowerCase())+"&select=club_id")
                         .then(function(r){ var id=(r&&r[0])?r[0].club_id:0;
                           return id?get("plat_clubs?id=eq."+id+"&select=id,name,colour,pool_id"):[]; });
    return first.then(function(rows){
      if(!rows||!rows.length) throw new Error("club not found");
      D.club=rows[0]; D.pool=rows[0].pool_id;
      document.documentElement.style.setProperty("--club", D.club.colour||"#6c3483");
      document.documentElement.style.setProperty("--club-deep", dark(D.club.colour||"#6c3483",.42));
      return get("nat_club_parent?club_id=eq."+D.club.id+"&select=group_id");
    }).then(function(kids){
      D.boards=[D.club.id].concat((kids||[]).map(function(k){ return k.group_id; }));
      var inList="club_id=in.("+D.boards.join(",")+")";
      return Promise.all([
        get("plat_matches?"+inList+"&discipline=eq.padel&select=id,club_id,match_date,match_type,t1p1,t1p2,t2p1,t2p2,t1_sets,t2_sets,rating_delta&order=match_date.desc,id.desc&limit=120"),
        get("plat_player_results?"+inList+"&discipline=eq.padel&select=name,club_id,current_rating,initial_rating,sets_played,sets_won&order=current_rating.desc&limit=60"),
        get("plat_padel_tournaments?"+inList+"&select=id,name,club_id,active,archived").catch(function(){ return []; }),
        get("plat_clubs?pool_id=eq."+D.pool+"&select=id,name,colour")
      ]);
    }).then(function(res){
      D.matches=res[0]||[]; D.pairs=res[1]||[]; D.allClubs=res[3]||[];
      var t=(res[2]||[]).filter(function(x){ return x.active && !x.archived; });
      D.tour=t.length?t[0]:null;
      movers();
      D.example = D.matches.length < 5;
      if(D.example) exampleData();
      render();
    }).catch(function(e){
      document.getElementById("wrap").innerHTML='<div class="load">Could not read that club.<br><br>Try <b>?club=north-coast</b> or <b>?club=kloof-padel-club</b>.<br><br><small>'+esc(e.message||e)+'</small></div>';
    });
  }

  /* who moved most in the last seven days — each person's own deltas, as the engine keeps them */
  function movers(){
    var sum={}, when={};
    D.matches.forEach(function(m){
      if(days(m.match_date)>7) return;
      var d=(m.rating_delta!=null)?+m.rating_delta:0; if(!d) return;
      [[m.t1p1,d],[m.t1p2,d],[m.t2p1,-d],[m.t2p2,-d]].forEach(function(p){
        var nm=p[0]; if(!nm) return;
        String(nm).split(" & ").forEach(function(x){ x=x.trim(); if(!x) return;
          sum[x]=(sum[x]||0)+p[1]; when[x]=when[x]||m.match_date; });
      });
    });
    D.movers=Object.keys(sum).map(function(n){ return {name:n,move:sum[n],when:when[n]}; })
      .sort(function(a,b){ return Math.abs(b.move)-Math.abs(a.move); }).slice(0,3);
  }

  function exampleData(){
    D.movers=[{name:"Sipho Dlamini",move:38},{name:"Tanya Roux",move:27},{name:"Ben Harker",move:-21}];
    D.pairs=[{name:"Sipho Dlamini & Ben Harker",current_rating:1642,initial_rating:1600,sets_played:9,sets_won:7},
             {name:"Tanya Roux & Nomsa Zulu",current_rating:1588,initial_rating:1570,sets_played:6,sets_won:4}];
    D.matches=[{match_date:new Date().toISOString().slice(0,10),t1p1:"Sipho Dlamini",t1p2:"Ben Harker",t2p1:"Tanya Roux",t2p2:"Nomsa Zulu",t1_sets:2,t2_sets:1,club_id:D.club.id}];
  }

  /* ---------- pieces ---------- */
  function band(kicker){
    var played7=D.matches.filter(function(m){ return days(m.match_date)<=7; }).length;
    var pulse=[];
    if(played7) pulse.push(played7+(played7===1?" match":" matches")+" this week");
    if(D.movers[0]) pulse.push("biggest move "+(D.movers[0].move>0?"+":"")+Math.round(D.movers[0].move)+" · "+D.movers[0].name.split(" ")[0]);
    if(D.tour) pulse.push(D.tour.name+" running");
    if(!pulse.length) pulse.push("waiting on the first match");
    return '<div class="band"><div class="mark"><i></i>OPR \u00b7 Open Padel Ratings</div>'
      +'<h1>'+esc(D.club.name)+'</h1>'
      +'<div class="sub">'+esc(kicker)+'</div>'
      +'<div class="pulse">'+pulse.map(function(p){ return '<span>'+esc(p)+'</span>'; }).join("")+'</div></div>';
  }
  function tag(){ return D.example?'<span class="tag">example until you play</span>':''; }
  function moversBrk(){
    if(!D.movers.length) return "";
    return '<div class="brk"><h2>Movers this week '+tag()+'</h2><div class="rows">'
      +D.movers.map(function(m){
        var cls=m.move>=0?"up":"dn";
        return '<div class="row"><div class="av">'+esc(initials(m.name))+'</div>'
          +'<div class="nm"><b>'+esc(m.name)+'</b><span>'+(m.move>=0?"climbing":"giving ground")+'</span></div>'
          +'<div class="val"><b class="'+cls+'">'+(m.move>0?"+":"")+Math.round(m.move)+'</b><span class="nm">rating</span></div></div>';
      }).join("")+'</div><a class="more" href="#">See the full ratings and ladders \u2192</a></div>';
  }
  function formBrk(){
    var hot=D.pairs.filter(function(p){ return (p.sets_played||0)>=3; })
      .map(function(p){ return {name:p.name, pct:Math.round(100*(p.sets_won||0)/(p.sets_played||1)), move:Math.round((p.current_rating||0)-(p.initial_rating||0))}; })
      .sort(function(a,b){ return b.pct-a.pct || b.move-a.move; }).slice(0,2);
    if(!hot.length) return "";
    return '<div class="brk"><h2>In form '+tag()+'</h2><div class="rows">'
      +hot.map(function(p){
        return '<div class="row"><div class="av">'+esc(initials(p.name))+'</div>'
          +'<div class="nm"><b>'+esc(p.name)+'</b><span>'+p.pct+'% of sets won</span></div>'
          +'<div class="val"><b class="'+(p.move>=0?"up":"dn")+'">'+(p.move>0?"+":"")+p.move+'</b><span class="nm">since start</span></div></div>';
      }).join("")+'</div><a class="more" href="#">Every pair \u2192</a></div>';
  }
  function tourBrk(){
    if(!D.tour) return '<div class="brk"><h2>Tournaments</h2><div class="empty">Nothing running just now. A club tournament shows here while it is on \u2014 the leader, the round, and a tap through to the sheet.</div></div>';
    return '<div class="brk"><h2>Tournament \u00b7 running now</h2><div class="rows">'
      +'<div class="row"><div class="av">\u{1F3C6}</div><div class="nm"><b>'+esc(D.tour.name)+'</b><span>open \u00b7 tap for the sheet</span></div></div>'
      +'</div><a class="more" href="#">Open the tournament \u2192</a></div>';
  }
  function matchesBrk(n){
    var ms=D.matches.slice(0,n||3);
    if(!ms.length) return "";
    return '<div class="brk"><h2>Just played '+tag()+'</h2><div class="rows">'
      +ms.map(function(m){
        var a=[m.t1p1,m.t1p2].filter(Boolean).join(" & "), b=[m.t2p1,m.t2p2].filter(Boolean).join(" & ");
        var board=(D.allClubs||[]).filter(function(c){ return Number(c.id)===Number(m.club_id); })[0];
        return '<div class="row"><div class="nm"><b>'+esc(a)+'</b><span>'+esc(b)+'</span></div>'
          +'<div class="val"><b>'+(m.t1_sets==null?"":m.t1_sets+"\u2013"+m.t2_sets)+'</b><span class="nm" style="color:'+((board&&board.colour)||"#888")+'">'+esc(board?board.name:"")+'</span></div></div>';
      }).join("")+'</div><a class="more" href="#">All recent matches \u2192</a></div>';
  }
  function elsewhere(){
    var others=(D.allClubs||[]).filter(function(c){ return Number(c.id)!==Number(D.club.id) && D.boards.indexOf(c.id)<0; }).length;
    if(!others) return "";
    return '<a class="elsewhere" href="#"><b>See what\u2019s happening elsewhere \u2192</b>'
      +'<span>Every registered club in one ledger \u2014 one rating each, wherever they play.</span></a>';
  }
  function actions(){
    var ic={score:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
            lad:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
            cup:'<svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/><path d="M12 13v4M9 21h6"/></svg>'};
    return '<div class="doit"><button class="primary">'+ic.score+'Enter a score</button>'
      +'<button>'+ic.lad+'Ratings</button><button>'+ic.cup+'Tournaments</button></div>';
  }
  function tiles(){
    var played7=D.matches.filter(function(m){ return days(m.match_date)<=7; }).length;
    var people={}; D.matches.forEach(function(m){ [m.t1p1,m.t1p2,m.t2p1,m.t2p2].forEach(function(v){ if(v) String(v).split(" & ").forEach(function(x){ people[x.trim()]=1; }); }); });
    var top=D.pairs[0];
    return '<div class="tiles">'
      +'<div class="tile"><div class="k">This week</div><div class="v">'+played7+'</div><div class="n">matches at '+esc(D.club.name)+'</div></div>'
      +'<div class="tile"><div class="k">Playing</div><div class="v">'+Object.keys(people).length+'</div><div class="n">members with a match on record</div></div>'
      +'<div class="tile"><div class="k">Top pair</div><div class="v" style="font-size:15px;line-height:1.25">'+esc(top?top.name:"\u2014")+'</div><div class="n">'+(top?Math.round(top.current_rating):"")+'</div></div>'
      +'<div class="tile"><div class="k">Biggest move</div><div class="v '+(D.movers[0]&&D.movers[0].move<0?"dn":"up")+'">'+(D.movers[0]?((D.movers[0].move>0?"+":"")+Math.round(D.movers[0].move)):"\u2014")+'</div><div class="n">'+esc(D.movers[0]?D.movers[0].name:"")+'</div></div>'
      +'</div>';
  }

  /* ---------- the three doors ---------- */
  function render(){
    var w=document.getElementById("wrap"), h="";
    document.getElementById("who").textContent=D.club.name+(D.example?" · example data":" · live data");
    if(V===1){
      h = band("A glimpse of each thing, and a way in.")
        + moversBrk() + formBrk() + tourBrk() + matchesBrk(3) + elsewhere();
    } else if(V===2){
      h = band("The club at a glance, then what you came to do.")
        + tiles() + actions() + moversBrk() + tourBrk() + elsewhere();
    } else {
      h = band("Quiet: what happened, and one way in.")
        + matchesBrk(4) + moversBrk() + elsewhere();
    }
    h += '<div class="foot">Preview only \u00b7 nothing here is live \u00b7 real figures from '+esc(D.club.name)+'</div>';
    w.innerHTML=h;
  }
  window.pick=function(n){ V=n; [1,2,3].forEach(function(i){ document.getElementById("b"+i).className=(i===n?"on":""); }); if(D.club) render(); };
  pick(V);
  load();
})();
</script>
</body>
</html>
