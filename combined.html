<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Combined Clubs · OPR</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="./icon-192.png">
<!--
  combined.html — the register owner's own address.

  ?club=0&pool=13 is correct and unmemorable, and it is the one address that gets typed rather than tapped.
  This page is nothing but a signpost: it sends you straight to the combined ledger and keeps the installed
  icon pointing somewhere stable, so the query string can change one day without anyone reinstalling.

  A different register: combined.html?pool=8. It never guesses — no pool, no redirect.
-->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#141018;color:#efe8f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .box{text-align:center;padding:26px}
  .dot{width:10px;height:10px;border-radius:50%;background:#d8ea33;display:inline-block;margin:0 3px;animation:b 1.1s infinite}
  .dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
  h1{font-size:17px;font-weight:800;margin:14px 0 6px}
  p{font-size:13.5px;color:#a99cbb;margin:0}
  a{color:#d8ea33;font-weight:700}
</style>
</head>
<body>
  <div class="box">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <h1>Combined Clubs</h1>
    <p id="msg">Opening your clubs…</p>
  </div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var pool = parseInt(q.get("pool") || "13", 10) || 0;      // 13 unless told otherwise
  if (!pool) { document.getElementById("msg").textContent = "No register named."; return; }
  /* 16 Sep, evening: this used to open the LEDGER, which is a dead end — the ledger has no club list, by
     design, because every club can reach it. The REGISTER DOOR is the owner's own page: it lists the clubs,
     and the ledger is one card on it. So this is the address to bookmark or install: everything is one tap
     from here, and no club ever has it. */
  var to = "./nat-padel.html?pool=" + pool;
  // replace, not assign: Back goes where you actually came from, not around this signpost again
  location.replace(to);
  setTimeout(function(){
    document.getElementById("msg").innerHTML = 'If nothing happens, <a href="' + to + '">open your clubs</a>.';
  }, 1500);
})();
</script>
</body>
</html>
