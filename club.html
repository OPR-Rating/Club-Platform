    * POOL LAYER (§3d): the club row carries pool_id. Members = plat_memberships of THIS club; their ratings are
      the POOL's (plat_individual_ratings). Rating belongs to the person, ranking to the club.
    * LADDER tab (new — the two-club proof): this club's members ranked by their pool rating, per sport; a
      member in another club of the pool shows the same number there. Replicas (step 5) carry the full apps.
    * ADMIN: sport switches per club (plat_admin set_sport); "Add an existing pool member" (add_membership);

<script>
/* v29 ARRIVAL VEIL: any entry carrying replica params (?member= / ?view=admin / ?r=) is a
   RETURN journey — paint the branded green before the shell can flash, lifted by render()
   the moment the destination view stands (8s failsafe so the page can never stay covered). */
(function(){ try{
  var q=location.search||"";
  if(!(/[?&](member|view|r)=/.test(q))) return;
  var cid=(q.match(/[?&]club=(\d+)/)||[])[1]||"1";
  var cn=""; try{ cn=localStorage.getItem("plat_name_"+cid)||""; }catch(e){}
  var esc=function(x){ return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;"); };
  var v=document.createElement("div"); v.id="ccArriveVeil";
  v.style.cssText="position:fixed;inset:0;z-index:99999;background:#1B3B2F;display:flex;align-items:center;justify-content:center";
  v.innerHTML='<div style="text-align:center;color:#F2EDE0;font-family:Georgia,\'Times New Roman\',serif">'
    +'<div style="font-size:27px;font-weight:700;letter-spacing:.5px;margin-bottom:6px">'+esc(cn||"Club")+'</div>'
    +'<div style="font-size:11px;letter-spacing:3px;color:#C9A44C;text-transform:uppercase;margin-bottom:22px">One register · One rating home</div>'
    +'<div style="width:26px;height:26px;margin:0 auto;border:3px solid rgba(201,164,76,.25);border-top-color:#C9A44C;border-radius:50%;animation:ccspin .9s linear infinite"></div></div>';
  var st=document.createElement("style"); st.textContent="@keyframes ccspin{to{transform:rotate(360deg)}}";
  v.appendChild(st); document.body.appendChild(v);
  document.documentElement.style.overflow="hidden";
  setTimeout(function(){ var e=document.getElementById("ccArriveVeil"); if(e){ e.remove(); document.documentElement.style.overflow=""; } }, 8000);
}catch(e){} })();
</script>

};

/* ================= DATA HELPERS ================= */
function rest(path){ return fetch(SB_URL+"/rest/v1/"+path,{headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON}}).then(function(r){return r.json();}); }
function fn(name,body){ return fetch(SB_URL+"/functions/v1/"+name,{method:"POST",headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

/* ================= STATE ================= */
var S={view:"home",members:[],ratings:{},poolClubs:[],pool:null,club:null,profName:null,ladDisc:null,adminPin:"",adminOpen:false,adminClub:null,adminMaster:false,adminClubs:[],pools:[]};

/* ================= BOOT ================= */
var MEMBER_PARAM=(function(){ var m=(location.search||"").match(/[?&]member=([^&]+)/); return m?decodeURIComponent(m[1]):null; })();
var ADMIN_RETURN=/[?&]view=admin(&|$)/.test(location.search||"");
function boot(){
  try{ var _cn=localStorage.getItem("plat_name_"+CID); if(_cn){ document.getElementById("clubName").textContent=_cn; sessionStorage.setItem("plat_club_name",_cn); } }catch(e){}
  document.getElementById("main").innerHTML='<div class="card"><div class="muted">Opening…</div></div>';
  rest("plat_clubs?id=eq."+CID+"&select=id,pool_id,name,disciplines").then(function(rows){

    if(!S.club){ document.getElementById("clubName").textContent="Club "+CID+" not found"; document.getElementById("main").innerHTML='<div class="card"><div class="muted">No club with id '+CID+'.</div></div>'; ccArriveLift(); return; }

          document.getElementById("main").innerHTML='<div class="card" style="text-align:center;padding:38px 16px"><div style="width:26px;height:26px;margin:0 auto 14px;border:3px solid rgba(201,164,76,.35);border-top-color:#C9A44C;border-radius:50%;animation:ccspin .9s linear infinite"></div><div class="muted">Opening admin…</div><style>@keyframes ccspin{to{transform:rotate(360deg)}}</style></div>';

function navOn(v){ Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(x){x.classList.toggle("on",x.getAttribute("data-v")===v);}); }
/* PLAT: the club's members are its MEMBERSHIPS; ratings are the POOL's, one row per (person, sport). */
function loadRoster(){
  var pid=S.club.pool_id;
  return Promise.all([
    rest("plat_memberships?club_id=eq."+CID+"&select=individual_id"),
    rest("plat_individuals?pool_id=eq."+pid+"&select=id,full_name,gender&order=full_name"),

  ]).then(function(res){
    var mine={}; (res[0]||[]).forEach(function(r){ mine[r.individual_id]=1; });
    S.poolMembers=res[1]||[];
    S.members=S.poolMembers.filter(function(i){ return mine[i.id]; });
    S.ratings={}; (res[2]||[]).forEach(function(r){ (S.ratings[r.individual_id]=S.ratings[r.individual_id]||{})[r.discipline]={seed:r.seed!=null?+r.seed:null,current_rating:r.current_rating!=null?+r.current_rating:null}; });
    S.memberClubIds={}; (res[3]||[]).forEach(function(r){ (S.memberClubIds[r.individual_id]=S.memberClubIds[r.individual_id]||[]).push(r.club_id); });
  });
}
function ratingOf(iid,d){ var r=(S.ratings[iid]||{})[d]; if(!r) return {cur:null,seed:null}; return {cur:(r.current_rating!=null?r.current_rating:r.seed), seed:r.seed}; }

function ccToggleHc(){
  var box=document.getElementById("ccHc"), car=document.getElementById("ccHcCaret"); if(!box) return;

function loadRecentHandicap(){
  var box=document.getElementById("ccHc"); if(!box) return;
  var jobs = DISCS.map(function(d){
    return rest("plat_"+d+"_tournaments?club_id=eq."+CID+"&handicap=eq.true&select=name").then(function(tours){
      if(!Array.isArray(tours)) return [];   // sport without tournament twins yet
      return Promise.all(tours.map(function(t){
        return rest("plat_"+d+"_tournament_fixtures?club_id=eq."+CID+"&tournament=eq."+encodeURIComponent(t.name)+"&sets_a=not.is.null&select=id,tournament,division,seed_a,seed_b,sets_a,sets_b,games_a,games_b&order=id.desc&limit=5")
          .then(function(fx){ return (Array.isArray(fx)?fx:[]).map(function(f){ f._d=d; return f; }); });
      })).then(function(a){ return [].concat.apply([],a); });
    }).catch(function(){ return []; });
  });
  Promise.all(jobs).then(function(per){
    var fx=[].concat.apply([],per); _hcLoaded=true;
    if(!fx.length){ box.innerHTML='<div class="muted">No handicap results yet — handicap events are just for fun and never touch ratings.</div>'; return; }
    fx.sort(function(a,b){ return b.id-a.id; }); fx=fx.slice(0,8);
    var cache={};
    function names(f){ var key=f._d+'|'+f.tournament+'|'+f.division;
      if(!cache[key]) cache[key]=rest("plat_"+f._d+"_tournament_entries?club_id=eq."+CID+"&tournament=eq."+encodeURIComponent(f.tournament)+"&category=eq."+encodeURIComponent(f.division)+"&select=seed,p1,p2").then(function(ents){ var m={}; (ents||[]).forEach(function(e){ m[e.seed]= e.p2 ? (e.p1+' / '+e.p2) : e.p1; }); return m; }).catch(function(){ return {}; });
      return cache[key]; }
    Promise.all(fx.map(names)).then(function(maps){
      var h='';
      fx.forEach(function(f,i){ var m=maps[i]; var a=m[f.seed_a]||('Seed '+f.seed_a), b=m[f.seed_b]||('Seed '+f.seed_b); var aWin=f.sets_a>f.sets_b; var dc=SP(f._d).colour;
        h+='<div style="padding:8px 12px;margin:8px 0;background:#fff;border:1px solid var(--linen-2);border-left:4px solid '+dc+';border-right:4px solid '+dc+';border-radius:10px">'
          +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.72rem"><span class="pill '+f._d+'">'+esc(SP(f._d).label)+'</span><span class="muted">'+esc(f.tournament)+' · '+esc(f.division)+'</span><span style="background:#8a6d1a;color:#fff;font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:4px">H</span></div>'
          +'<div style="margin-top:3px"><b style="color:'+(aWin?'var(--club)':'#555')+'">'+esc(a)+(aWin?' ✓':'')+'</b> <span class="muted">vs</span> <b style="color:'+(!aWin?'var(--club)':'#555')+'">'+esc(b)+(!aWin?' ✓':'')+'</b>'
          +' <span style="color:var(--brass);font-weight:700">'+f.sets_a+'–'+f.sets_b+'</span> <span class="muted">('+(f.games_a||0)+'–'+(f.games_b||0)+')</span></div></div>';
      });
      box.innerHTML=h+'<div class="muted" style="text-align:center;font-size:.7rem;margin-top:6px">Handicap results — just for fun, no effect on ratings.</div>';
    });
  });

/* row renderers by family: racquet = "A & B 1–0 C & D"; bowls = names 21–14 names · N ends */
function sideNames(r,t){ var out=[]; [1,2,3,4].forEach(function(i){ var v=r["t"+t+"p"+i]; if(v!=null && String(v).trim()!=="") out.push(String(v).trim()); }); return out; }
function rowLine(r){
  var s=SP(r.discipline);
  var a=r.display_t1?esc(r.display_t1):esc(sideNames(r,1).join(" & "));
  var b=r.display_t2?esc(r.display_t2):esc(sideNames(r,2).join(" & "));
  if(s.grammar==="shots"){
    return a+' <span style="color:#B8860B;font-weight:800">'+(r.t1_games||0)+'\u2013'+(r.t2_games||0)+'</span> '+b
      +(r.ends?' <span class="muted" style="font-size:.7rem">· '+r.ends+' ends</span>':'')+(r.peel?' <span style="background:#8a6d1a;color:#fff;font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:4px">PEEL</span>':'');
  }
  return a+' <span style="color:#B8860B;font-weight:800">'+(r.t1_sets||0)+'\u2013'+(r.t2_sets||0)+'</span> '+b;
}
function recentHTML(rows){
  if(!rows.length) return '<div class="muted">No matches yet — the first result will appear here.</div>';

      +'<div style="display:flex;align-items:center;gap:8px">'

      +'<span class="muted" style="font-size:.7rem">'+esc(r.match_date||'')+'</span>'
      +'<span class="muted" style="font-size:.7rem">'+esc(r.match_type||'')+'</span>'+tag
      +'<span id="ccRcaret'+idx+'" style="margin-left:auto;color:#B8860B;font-size:.7rem">\u25bc</span></div>'

  });

    h+='<div class="plaque '+d+'" onclick="goProfile(\''+d+'\')">'
      +'<div><div class="d">'+esc(SP(d).label)+'</div><div class="r">'+(cur!=null?Math.round(cur):"–")+'</div></div>'
      +'<div class="side">level '+lvl(cur)+'<br>move '+mvHtml(mv(cur,r.seed))+'<br>'+rk+' ›</div></div>';
  });
  if(!DISCS.length) h+='<div class="muted">No sports switched on.</div>';
  m.innerHTML=h+'</div></div>';
}

/* ================= ADMIN ================= */
function vAdmin(m){
  if(!S.adminOpen){
    m.innerHTML='<div class="card"><h2>Admin</h2>'
      +'<label>Admin PIN</label><input type="password" id="aPin" inputmode="numeric">'
      +'<button class="btn" onclick="aUnlock()">Open admin</button>'
      +'<div class="muted" style="margin-top:6px">Your club code opens your club\'s admin. The master code opens every club.</div>'
      +'<div class="msg" id="aGateMsg"></div></div>';
    return;
  }
  var here=S.adminClub?S.adminClub.name:"";
  var h='<div class="card"><h2>Admin — '+esc(here)+'</h2>'
    +'<div class="row"><div class="muted">'+(S.adminMaster?"Master access":"Club admin access")+(S.pool?(' · register: '+esc(S.pool.name)):'')+'</div>'
    +'<div style="text-align:right"><button class="mini" onclick="aLock()">Close admin</button></div></div>';
  if(S.adminMaster && S.adminClubs.length>1){
    h+='<label>Administering club</label><select id="aClubSel" onchange="aSwitchClub()">';
    S.adminClubs.forEach(function(c){ h+='<option value="'+c.id+'"'+((S.adminClub&&S.adminClub.id===c.id)?" selected":"")+'>'+esc(c.name)+' (#'+c.id+')</option>'; });
    h+='</select>';
  }
  h+='</div>';
  /* SPORTS — the one toggle (§3a). ON appends + seeds every member's ratings row; OFF hides; data never deleted. */
  h+='<div class="card"><h3>Sports</h3><div class="muted">Switch a sport on and its card, plaque, ladder and engine appear for this club. Switching off hides it — nothing is deleted.</div><div style="margin-top:6px">';
  Object.keys(SPORTS).forEach(function(d){ var on=DISCS.indexOf(d)>=0;
    h+='<div class="tog"><div><b>'+esc(SPORTS[d].label)+'</b> <span class="muted">'+esc(SPORTS[d].engine)+'</span></div><button class="sw'+(on?' on':'')+'" onclick="aToggleSport(\''+d+'\','+(on?'false':'true')+')" aria-label="'+(on?'off':'on')+'"></button></div>'; });
  h+='</div><div class="msg" id="aMsgS"></div></div>';
  if(DISCS.length){
    h+='<div class="card"><h3>Sport control rooms</h3>'
      +'<div class="muted">Pairs, tournaments and match corrections live inside each sport\'s own Control Room (its Admin tab) — the same proven admin as the standalone apps.</div>'
      +'<div class="row" style="margin-top:8px;flex-wrap:wrap">';
    DISCS.forEach(function(d){ h+='<button class="mini" style="padding:10px" onclick="goControl(\''+d+'\')">'+esc(SP(d).label)+'</button>'; });
    h+='</div></div>';
  }
  h+='<div class="card"><h3>Register one member</h3>'
    +'<div class="muted">One person, one starting rating per sport. Choosing the gender fills the player defaults (1500 M / 1300 F) — type over any of them. Clear a sport\'s box if they don\'t play it: they start at the non-player default (1300 M / 1200 F).</div>'
    +'<div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap">'
    +'<input id="aRegName" placeholder="Full name" style="flex:2;min-width:160px">'
    +'<select id="aRegG" onchange="aRegDefaults()" style="flex:0 0 70px"><option value="M">M</option><option value="F">F</option></select>';
  DISCS.forEach(function(d){ h+='<input id="aReg_'+d+'" type="number" placeholder="'+esc(SP(d).label)+'" style="flex:1;min-width:80px">'; });
  h+='<input id="aRegPin" type="text" inputmode="numeric" placeholder="PIN (optional)" style="flex:1;min-width:90px">'
    +'</div><button class="btn" onclick="aRegOne()">Register member</button><div class="msg" id="aMsgR"></div></div>';
  if(S.poolClubs.length>1){
    var elsewhere=(S.poolMembers||[]).filter(function(i){ return !S.members.some(function(x){return x.id===i.id;}); });
    h+='<div class="card"><h3>Add an existing member of '+esc(S.pool?S.pool.name:"the shared register")+'</h3>'
      +'<div class="muted">People already registered at '+esc(S.poolClubs.filter(function(c){return c.id!==CID;}).map(function(c){return c.name;}).join(", "))+'. Linking them here adds them to this club\'s ladder with the rating they already hold — no second registration, no second rating.</div>'
      +'<select id="aLink"><option value="">— choose —</option>';
    elsewhere.forEach(function(i){ h+='<option value="'+i.id+'">'+esc(i.full_name)+'</option>'; });
    h+='</select><button class="btn" onclick="aLinkMember()">Add to '+esc(S.club.name)+'</button><div class="msg" id="aMsgL"></div></div>';
  }
  if(DISCS.length){
    h+='<div class="card"><h3>Engine room</h3>'
      +'<div class="muted">Replays every match from the current bases and rewrites that sport\'s ratings for the whole register. Run after seed changes or restores.</div>'
      +'<div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap">';
    DISCS.forEach(function(d){ h+='<button class="btn" onclick="aRecompute(\''+d+'\')">Recompute '+esc(SP(d).label)+'</button>'; });
    if(DISCS.length>1) h+='<button class="btn" onclick="aRecomputeAll()">Recompute all</button>';
    h+='</div><div id="aMsgEng" style="margin-top:6px"></div></div>';
  }
  h+='<div class="card"><h3>Bulk add members (paste from Excel)</h3>'
    +'<div class="muted">One member per line: Name, Gender'+DISCS.map(function(d){return ', '+SP(d).label;}).join('')+' (comma or tab separated). Gender M or F required. A filled rating is used as typed; a BLANK sport = doesn\'t play it — starts at 1300 M / 1200 F.</div>'
    +'<textarea id="aBulk" style="width:100%;min-height:140px;font-family:monospace;font-size:12px;border:1px solid #cfc7b2;border-radius:7px;padding:9px;margin-top:8px" placeholder="John Smith, M'+DISCS.map(function(){return ', 1500';}).join('')+'"></textarea>'
    +'<button class="btn" onclick="aBulkAdd()">Add all pasted members</button><div class="msg" id="aMsgB"></div></div>';
  h+='<div class="card"><h3>Member directory ('+S.members.length+')</h3>'
    +'<div class="muted">This club\'s register: seed → current per sport. Edits live in the sport Control Rooms.</div>'
    +'<input type="text" id="aDirSearch" placeholder="Search name…" oninput="aDirFilter()" autocomplete="off" style="margin-top:8px">'
    +'<div id="aDir" style="max-height:340px;overflow:auto;margin-top:8px"></div></div>';
  setTimeout(aDirFilter,0);
  if(S.adminMaster){
    h+='<div class="card"><h3>Clubs (master)</h3>'
      +'<label>Register (pool)</label><select id="aCpool"><option value="__new__">— new register —</option>';
    (S.pools||[]).forEach(function(p){ h+='<option value="'+p.id+'"'+((S.club&&p.id===S.club.pool_id)?' selected':'')+'>'+esc(p.name)+'</option>'; });
    h+='</select><label>New register name (only if new)</label><input type="text" id="aPn">'
      +'<label>New club name</label><input type="text" id="aCn">'
      +'<label>Its admin PIN</label><input type="text" id="aCp">'
      +'<button class="btn" onclick="aAddClub()">Create club</button>'
      +'<div class="muted" style="margin-top:6px">A club that shares a register with another (e.g. two padel clubs whose members play at both) gives its members ONE rating, ranked at each club. A club on its own register stands alone.</div>'
      +'<div class="msg" id="aMsg4"></div></div>';
  }
  m.innerHTML=h;
}
function apin(){ return S.adminPin; }
function aUnlock(pinArg){
  var p=pinArg||val("aPin");
  var msg=document.getElementById("aGateMsg")||{className:"",textContent:""};
  if(!p){ msg.className="msg err"; msg.textContent="Enter a PIN."; return; }
  msg.className="msg ok"; msg.textContent="Checking…";
  fn("plat_admin",{action:"list_clubs"}).then(function(r){
    var clubs=(r&&r.clubs)||[];
    var probeIds=[CID].concat(clubs.map(function(c){return c.id;}).filter(function(i){return i!==CID;}));
    var i=0;
    function tryNext(){
      if(i>=probeIds.length){ msg.className="msg err"; msg.textContent="PIN not recognised."; return; }
      var id=probeIds[i++];
      fn("plat_admin",{action:"edit_member",club_id:id,admin_pin:p,full_name:"__pin_probe__"}).then(function(rr){
        var e=(rr&&rr.error)||"";
        if(e==="Admin PIN required."){ tryNext(); return; }
        S.adminPin=p; S.adminOpen=true; S.adminClubs=clubs;
        S.adminClub=clubs.find(function(c){return c.id===id;})||{id:id,name:"Club #"+id};
        var other=clubs.find(function(c){return c.id!==id;});
        var fin=function(){ fn("plat_admin",{action:"list_pools"}).then(function(pr){ S.pools=(pr&&pr.pools)||[]; afterUnlock(); }); };
        if(other){
          fn("plat_admin",{action:"edit_member",club_id:other.id,admin_pin:p,full_name:"__pin_probe__"}).then(function(r2){
            S.adminMaster=((r2&&r2.error)||"")!=="Admin PIN required.";
            if(!S.adminMaster){ S.adminClubs=[S.adminClub]; }
            fin();
          });
        } else { S.adminMaster=true; fin(); }
      });
    }
    tryNext();
  });
}
function afterUnlock(){
  S._silentUnlock=false;
  if(S.adminClub && S.adminClub.id!==CID){ location.search="?club="+S.adminClub.id; return; }
  render();
}
function aSwitchClub(){ var id=parseInt(val("aClubSel"),10); if(id && (!S.adminClub||id!==S.adminClub.id)){ location.search="?club="+id; } }
function aLock(){ S.adminOpen=false; S.adminPin=""; S.adminMaster=false; render(); }
function aToggleSport(d,on){
  var msg=document.getElementById("aMsgS"); msg.className="msg ok"; msg.textContent=(on?"Switching on ":"Switching off ")+SP(d).label+"…";
  fn("plat_admin",{action:"set_sport",club_id:CID,admin_pin:apin(),discipline:d,on:on}).then(function(r){
    if(r&&r.ok){ S.club.disciplines=r.disciplines; DISCS=r.disciplines.filter(function(x){return !!SPORTS[x];}); document.documentElement.style.setProperty("--nsports",String(Math.max(1,Math.min(3,DISCS.length||1)))); S._recent=null;
      var sub=document.getElementById("clubSub"); if(sub) sub.textContent=DISCS.length?(DISCS.map(function(x){return SP(x).label;}).join(" · ")+" · One rating home"):"No sports switched on yet";
      loadRoster().then(render); }
    else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Failed."; }
  });
}
function aEngLine(d,txt,ok){
  var box=document.getElementById("aMsgEng"); if(!box) return;
  box.style.display="block";
  var ln=document.getElementById("aEng_"+d);
  if(!ln){ ln=document.createElement("div"); ln.id="aEng_"+d; box.appendChild(ln); }
  ln.className="msg "+(ok===null?"ok":(ok?"ok":"err")); ln.style.display="block"; ln.textContent=txt;
}
function aRecompute(d){
  aEngLine(d, SP(d).label+": recomputing…", null);
  return fn("plat_admin",{action:"recompute",discipline:d,club_id:CID,admin_pin:apin()}).then(function(r){
    var ok=!!(r&&r.ok);
    var detail=(ok&&r.engine&&r.engine.players!=null)?(" ("+r.engine.players+" players, "+(r.engine.moves||0)+" matches)"):"";
    aEngLine(d, SP(d).label+": "+(ok?("recomputed"+detail+"."):((r&&r.error)||"failed.")), ok);
    if(ok) loadRoster();
    return ok;
  }).catch(function(){ aEngLine(d, SP(d).label+": failed (network).", false); return false; });
}
function aRecomputeAll(){
  var box=document.getElementById("aMsgEng"); if(box) box.innerHTML="";
  var n=0, i=0;
  function next(){ if(i>=DISCS.length){ aEngLine("all",(n===DISCS.length)?"All sports recomputed.":("Done — "+n+" of "+DISCS.length+" succeeded — the failed sport's line shows why."), n===DISCS.length); return; }
    aRecompute(DISCS[i++]).then(function(ok){ if(ok)n++; next(); }); }
  next();
}
function aRegDefaults(){
  var g=val("aRegG")||"M", d=(g==="F")?1300:1500;
  DISCS.forEach(function(x){ var e=document.getElementById("aReg_"+x); if(e) e.value=d; });
}
function aRegOne(){
  var msg=document.getElementById("aMsgR"); msg.className="msg";
  var name=(val("aRegName")||"").trim(), g=val("aRegG")||"M";
  if(!name){ msg.className="msg err"; msg.textContent="Name required."; return; }
  var seeds={}; DISCS.forEach(function(d){ var v=val("aReg_"+d); seeds[d]=(v===""?null:Number(v)); });
  msg.className="msg ok"; msg.textContent="Registering…";
  fn("plat_admin",{action:"add_member",club_id:CID,admin_pin:apin(),full_name:name,gender:g,pin:val("aRegPin")||null,seeds:seeds}).then(function(r){
    if(r&&r.ok){ msg.className="msg ok"; msg.textContent="Registered "+name+"."; document.getElementById("aRegName").value=""; loadRoster().then(render); }
    else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Failed."; }
  });
}
function aLinkMember(){
  var msg=document.getElementById("aMsgL"); var iid=parseInt(val("aLink"),10);
  if(!iid){ msg.className="msg err"; msg.textContent="Choose a member."; return; }
  msg.className="msg ok"; msg.textContent="Linking…";
  fn("plat_admin",{action:"add_membership",club_id:CID,admin_pin:apin(),individual_id:iid}).then(function(r){
    if(r&&r.ok){ msg.className="msg ok"; msg.textContent="Added."; loadRoster().then(render); }
    else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Failed."; }
  });
}
function aBulkAdd(){
  var msg=document.getElementById("aMsgB"); msg.className="msg";
  var raw=val("aBulk");
  var lines=raw.split("\n").map(function(l){return l.trim();}).filter(function(l){return l.length;});
  if(!lines.length){ msg.className="msg err"; msg.textContent="Nothing to add — paste some rows first."; return; }
  var rows=[], errs=[];
  lines.forEach(function(ln,i){
    var parts=ln.split(/\t|,/).map(function(p){return p.trim();});
    while(parts.length && parts[parts.length-1]==="") parts.pop();
    if(parts.length<2 || !parts[0]){ errs.push("Line "+(i+1)+": need at least Name, Gender."); return; }
    var name=parts[0], gender=(parts[1]||"").toUpperCase().charAt(0);
    if(gender!=="M"&&gender!=="F"){ errs.push("Line "+(i+1)+" ("+name+"): gender must be M or F."); return; }
    var seeds={}; DISCS.forEach(function(d,k){ seeds[d]=parts[2+k]||null; });
    rows.push({ full_name:name, gender:gender, seeds:seeds });
  });
  if(errs.length){ msg.className="msg err"; msg.innerHTML=errs.map(esc).join("<br>"); return; }
  msg.className="msg ok"; msg.textContent="Adding "+rows.length+" members…";
  fn("plat_admin",{action:"bulk_add_members",club_id:CID,admin_pin:apin(),rows:rows}).then(function(r){
    if(r&&r.ok){
      var t="Added "+r.added+" member"+(r.added===1?"":"s")+".";
      if(r.failed&&r.failed.length){ msg.className="msg err"; msg.textContent=t+" Failed: "+r.failed.join(", "); }
      else { msg.className="msg ok"; msg.textContent=t; document.getElementById("aBulk").value=""; }
      loadRoster().then(render);
    } else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Failed."; }
  });
}
function aDirFilter(){
  var q=(val("aDirSearch")||"").toLowerCase();
  var rows=S.members.filter(function(r){ return !q || r.full_name.toLowerCase().indexOf(q)>=0; });
  var el=document.getElementById("aDir"); if(!el)return;
  if(!rows.length){ el.innerHTML='<span class="muted">No members match.</span>'; return; }
  var h='<table><tr><th>Name</th><th>G</th>'+DISCS.map(function(d){return '<th>'+esc(SP(d).label)+'</th>';}).join('')+'</tr>';
  rows.forEach(function(r){
    h+='<tr><td>'+esc(r.full_name)+'</td><td>'+esc(r.gender||"")+'</td>';
    DISCS.forEach(function(d){ var x=ratingOf(r.id,d); h+='<td>'+(x.seed!=null?Math.round(x.seed):"–")+(x.cur!=null&&x.seed!=null&&Math.round(x.cur)!==Math.round(x.seed)?' <span class="muted">→ '+Math.round(x.cur)+'</span>':'')+'</td>'; });
    h+='</tr>';
  });
  el.innerHTML=h+'</table>';
}
function aAddClub(){
  var msg=document.getElementById("aMsg4"); msg.className="msg ok"; msg.textContent="Working…";
  var sel=val("aCpool"), name=val("aCn"), cpin=val("aCp");
  var go=function(pool_id){
    fn("plat_admin",{action:"add_club",admin_pin:apin(),pool_id:pool_id,name:name,club_admin_pin:cpin}).then(function(r){
      if(r&&r.ok){ msg.className="msg ok"; msg.textContent="Created club #"+r.club.id+" — open with ?club="+r.club.id+" and switch its sports on."; }
      else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Failed."; }
    });
  };
  if(sel==="__new__"){
    var pn=val("aPn"); if(!pn){ msg.className="msg err"; msg.textContent="Name the new register."; return; }
    fn("plat_admin",{action:"add_pool",admin_pin:apin(),name:pn}).then(function(r){ if(r&&r.ok) go(r.pool.id); else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Failed."; } });
  } else go(parseInt(sel,10));
}

boot();
</script>
